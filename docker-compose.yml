services:
  mongodb:
    image: mongo:7
    container_name: admin_panel_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: admin_panel
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - admin_panel_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admin_panel_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/admin_panel?authSource=admin
      JWT_SECRET: your-secret-key-change-in-production
      FRONTEND_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    networks:
      - admin_panel_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: admin_panel_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - admin_panel_network

volumes:
  mongodb_data:
    driver: local

networks:
  admin_panel_network:
    driver: bridge
